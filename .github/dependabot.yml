# Weekly pull requests for the Go modules and the pinned actions, grouped so
# each ecosystem is one pull request. Titles are conventional commits, which
# release-please reads: the binary is built from the Go modules, so their
# updates (security ones included) are fixes that make a patch release; the
# actions only run CI, so theirs make none.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
