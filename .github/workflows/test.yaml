name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    name: Test (${{ matrix.os }})
    concurrency: ${{ github.ref }}/test/${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The binary ships for all three; each has its own keychain, paths
        # and file modes.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./cmd/tenjin
      - name: Run the binary
        # The tests call the command tree in-process; this starts the real
        # binary, console handling included.
        shell: bash
        run: |
          ./tenjin version
          ./tenjin sdk guide android > guide.md && grep -q TenjinSDK guide.md
          mkdir empty
          code=0; ./tenjin project detect empty --json 2> error.json || code=$?
          test "$code" -eq 5 && grep -q '"not_found"' error.json
      - name: Test
        if: runner.os != 'Windows'
        run: make test
      - name: Test
        # The race detector needs cgo, which the Windows runner has no C
        # compiler for.
        if: runner.os == 'Windows'
        run: go test ./...
