name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # The release workflow runs these first, so a tag is published only from
  # a commit that passes them.
  workflow_call:
jobs:
  test:
    name: Test (${{ matrix.os }})
    concurrency: ${{ github.ref }}/test/${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The binary ships for all three; each has its own keychain, paths
        # and file modes.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./cmd/tenjin
      - name: Run the binary
        # The tests call the command tree in-process; this starts the real
        # binary, console handling included.
        shell: bash
        run: |
          ./tenjin version
          ./tenjin sdk guide android > guide.md && grep -q TenjinSDK guide.md
          mkdir empty
          code=0; ./tenjin project detect empty --json 2> error.json || code=$?
          test "$code" -eq 5 && grep -q '"not_found"' error.json
      - name: Test
        if: runner.os != 'Windows'
        run: make test
      - name: Test
        # The race detector needs cgo, which the Windows runner has no C
        # compiler for.
        if: runner.os == 'Windows'
        run: go test ./...
  release:
    # The release pipeline, short of publishing: the archives, checksums and
    # cask a tag would publish.
    name: Release snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the configuration
        run: make release-check
      - name: Build
        run: make release-snapshot
      - name: Keep
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/metadata.json
            dist/homebrew/Casks/tenjin.rb
  install:
    # Installs the snapshot the way users will, from a local copy of the
    # release served over HTTP.
    name: Install (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch the snapshot
        uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Lay out the release
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("dist/metadata.json"))["version"])' 2>/dev/null ||
            python -c 'import json; print(json.load(open("dist/metadata.json"))["version"])')
          mkdir site
          cp dist/*.tar.gz dist/*.zip dist/checksums.txt install.sh install.ps1 site/
          echo "TENJIN_VERSION=$version" >> "$GITHUB_ENV"
          echo "TENJIN_RELEASES_URL=http://127.0.0.1:8765" >> "$GITHUB_ENV"
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          # Served as GitHub serves a release, /latest redirect included.
          python3 scripts/serve-release.py site "$TENJIN_VERSION" 8765 &
          until curl -fs http://127.0.0.1:8765/install.sh > /dev/null; do sleep 1; done
          curl -fsSL http://127.0.0.1:8765/install.sh | TENJIN_INSTALL_DIR="$RUNNER_TEMP/bin" TENJIN_NO_MODIFY_PATH=1 sh
          "$RUNNER_TEMP/bin/tenjin" version | grep -F "Tenjin CLI $TENJIN_VERSION"
          # A new user, with nothing on PATH to install into: a new terminal
          # must find the tenjin command with no step of theirs.
          shells="bash"
          if command -v zsh > /dev/null; then shells="bash zsh"; fi
          for shell in $shells; do
            home="$RUNNER_TEMP/home-$shell"
            mkdir -p "$home"
            # No version given, as a person runs it: the latest is looked up.
            curl -fsSL http://127.0.0.1:8765/install.sh |
              env -i HOME="$home" PATH=/usr/bin:/bin SHELL="/bin/$shell" \
                TENJIN_RELEASES_URL="$TENJIN_RELEASES_URL" sh
            # Once more: nothing is added twice.
            curl -fsSL http://127.0.0.1:8765/install.sh |
              env -i HOME="$home" PATH=/usr/bin:/bin SHELL="/bin/$shell" \
                TENJIN_RELEASES_URL="$TENJIN_RELEASES_URL" TENJIN_VERSION="$TENJIN_VERSION" sh > /dev/null
            modes="-lc -ic"
            if [ "$shell" = zsh ]; then modes="-c -lc -ic"; fi
            for mode in $modes; do
              found=$(env -i HOME="$home" PATH=/usr/bin:/bin TERM=dumb "/bin/$shell" $mode 'command -v tenjin' 2> /dev/null | tail -n 1 || true)
              test "$found" = "$home/.local/bin/tenjin" || { echo "$shell $mode found '$found'"; exit 1; }
            done
            for f in "$home"/.??*; do
              if [ -f "$f" ] && [ "$(grep -c 'Tenjin CLI installer' "$f")" -gt 1 ]; then echo "$f was changed twice"; exit 1; fi
            done
            echo "$shell: a new terminal finds the tenjin command"
          done
      - name: Homebrew
        if: runner.os != 'Windows'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if ! command -v brew > /dev/null; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap-new --no-git tenjin/local
          tap="$(brew --repository tenjin/local)"
          mkdir -p "$tap/Casks"
          sed -E "s#https://github.com/tenjin/tenjin-cli/releases/download/[^/]+/#file://$PWD/site/#" \
            dist/homebrew/Casks/tenjin.rb > "$tap/Casks/tenjin.rb"
          brew install --cask tenjin/local/tenjin
          "$(brew --prefix)/bin/tenjin" version | grep -F "Tenjin CLI $TENJIN_VERSION"
          ls "$(brew --prefix)/share/zsh/site-functions" "$(brew --prefix)/etc/bash_completion.d" "$(brew --prefix)/share/fish/vendor_completions.d" | grep -i tenjin
      - name: install.ps1, Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Start-Process -FilePath python -ArgumentList 'scripts/serve-release.py', 'site', $env:TENJIN_VERSION, '8765' -WindowStyle Hidden
          for ($i = 0; $i -lt 30; $i++) {
            try { Invoke-WebRequest -Uri 'http://127.0.0.1:8765/install.ps1' -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Seconds 1 }
          }
          irm http://127.0.0.1:8765/install.ps1 | iex
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\tenjin'
          tenjin version
          if (-not ((tenjin version) -like "Tenjin CLI $env:TENJIN_VERSION *")) { throw 'wrong version' }
          $saved = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (($saved -split ';') -notcontains $dir) { throw "$dir is not on the saved PATH: $saved" }
      - name: install.ps1 again, PowerShell 7
        # Over the installed copy, and with the other PowerShell.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try { Invoke-WebRequest -Uri 'http://127.0.0.1:8765/install.ps1' | Out-Null } catch {
            Start-Process -FilePath python -ArgumentList 'scripts/serve-release.py', 'site', $env:TENJIN_VERSION, '8765' -WindowStyle Hidden
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest -Uri 'http://127.0.0.1:8765/install.ps1' | Out-Null; break } catch { Start-Sleep -Seconds 1 }
            }
          }
          # No version given: the latest is looked up, through the redirect.
          $version = $env:TENJIN_VERSION
          $env:TENJIN_VERSION = $null
          irm http://127.0.0.1:8765/install.ps1 | iex
          $saved = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\tenjin'
          if (-not ((& (Join-Path $dir 'tenjin.exe') version) -like "Tenjin CLI $version *")) { throw 'the latest was not installed' }
          if ((@($saved -split ';') | Where-Object { $_ -eq $dir }).Count -ne 1) { throw "PATH should hold $dir once: $saved" }
          & (Join-Path $dir 'tenjin.exe') version
