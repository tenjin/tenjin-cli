name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  test:
    # Every test, install and snapshot job, on Linux, macOS and Windows.
    uses: ./.github/workflows/test.yaml
  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the tap can be updated
        # GoReleaser publishes the GitHub release before it pushes the cask,
        # so a tap it cannot push to would leave a release without its cask.
        # This catches a missing or wrong token before anything is published.
        # The token is tenjin-kraken's, inherited from the organization: the
        # tap lets that account push to main without a pull request, which
        # only a push shows. Pre-releases leave the tap alone (skip_upload: auto).
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.TENJIN_BOT_PRIVATE_ACCESS_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::The TENJIN_BOT_PRIVATE_ACCESS_TOKEN secret is not available."; exit 1; }
          push=$(gh api repos/tenjin/homebrew-tap --jq .permissions.push) ||
            { echo "::error::tenjin/homebrew-tap cannot be read with TENJIN_BOT_PRIVATE_ACCESS_TOKEN."; exit 1; }
          test "$push" = true || { echo "::error::TENJIN_BOT_PRIVATE_ACCESS_TOKEN cannot push to tenjin/homebrew-tap."; exit 1; }
      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tenjin-kraken's, which can push to tenjin/homebrew-tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.TENJIN_BOT_PRIVATE_ACCESS_TOKEN }}
