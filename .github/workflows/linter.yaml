name: Lint
on:
  # On main too, so the README's badge shows main's state.
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - internal/tenjinapi/openapi/**
      - go.mod
      - go.sum
      - .golangci.yml
      - Makefile
      - .github/workflows/**
      - '**/*.sh'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.go'
      - internal/tenjinapi/openapi/**
      - go.mod
      - go.sum
      - .golangci.yml
      - Makefile
      - .github/workflows/**
      - '**/*.sh'
permissions:
  contents: read
jobs:
  linter:
    name: Linter
    concurrency: ${{ github.ref }}/linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Format check
        run: make fmt-check
      - name: go.mod and go.sum are tidy
        # A module imported directly but marked indirect, or one no longer
        # used, fails here with the change `go mod tidy` would make.
        run: go mod tidy -diff
      - name: Generated clients match the specs
        run: |
          make generate
          # New files count too: a client generated but never committed.
          changed=$(git status --porcelain -- internal/tenjinapi)
          if [ -n "$changed" ]; then echo "$changed"; git diff -- internal/tenjinapi | head -50; exit 1; fi
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          args: --timeout=5m
  scripts:
    # The release workflow holds a token for the tap, and install.sh is piped
    # into people's shells: both are checked like code.
    name: Workflows and scripts
    concurrency: ${{ github.ref }}/scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: actionlint
        # It runs shellcheck over every run: block too.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh
