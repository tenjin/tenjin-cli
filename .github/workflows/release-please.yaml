name: Release Please
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  release-please:
    # Keeps a pull request open with the next version and its changelog, read
    # from the conventional commit titles on main. Merging it makes a draft
    # release and its tag.
    name: Release Please
    concurrency: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Token for this repository
        # The CLI's own GitHub App, installed on this repository and the tap
        # and nowhere else: a public repository holds no token that reaches a
        # private one, so the organization's shared app is not used here. A
        # pull request opened with the workflow's own token starts no checks.
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: tenjin
          repositories: tenjin-cli
          permission-contents: write
          permission-pull-requests: write
      - name: Release pull request or draft release
        # The draft gets its tag at once (force-tag-creation in
        # release-please-config.json): without it release-please cannot find
        # the previous release, and release.yaml and GoReleaser build from
        # the tag. So `go install ...@latest` takes the version before it is
        # tested and published, as the README says; a release abandoned after
        # its tag is withdrawn with a retract directive in go.mod.
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  release:
    name: Release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
