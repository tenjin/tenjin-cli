name: Release Please
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  release-please:
    # Keeps a pull request open with the next version and its changelog, read
    # from the conventional commit titles on main. Merging it makes a draft
    # release and its tag.
    name: Release Please
    concurrency: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Token for this repository
        # The organization's Code Ops app, as the SDK repositories use it. A
        # pull request opened with the workflow's own token starts no checks.
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CODE_OPS_APP_ID }}
          private-key: ${{ secrets.CODE_OPS_APP_PRIVATE_KEY }}
          owner: tenjin
          repositories: tenjin-cli
          permission-contents: write
          permission-pull-requests: write
      - name: Release pull request or draft release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  release:
    name: Release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      CODE_OPS_APP_PRIVATE_KEY: ${{ secrets.CODE_OPS_APP_PRIVATE_KEY }}
      AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
