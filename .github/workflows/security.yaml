name: Security
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/security.yaml
  # New vulnerabilities are published without any change here.
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  govulncheck:
    name: Known vulnerabilities
    concurrency: ${{ github.ref }}/govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        # Fails on a vulnerability the code can reach, in a module or in the
        # Go release the binary is built with (the toolchain line of go.mod).
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
